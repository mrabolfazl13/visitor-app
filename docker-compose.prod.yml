version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: b2b_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: b2b_sales
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b2b_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: b2b_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b2b_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: b2b_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - b2b_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/b2b_sales"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: product-images
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_ENV: production
      DEBUG: "false"
      CORS_ORIGINS: "http://visitor.absadeghi.ir,https://visitor.absadeghi.ir,http://localhost:3000,http://localhost:8080"
    ports:
      - "9105:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # volumes:
    #   - ./backend:/app  # Commented out to use built image instead of mounted files
    networks:
      - b2b_network
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b_celery_worker
    command: celery -A app.celery worker --loglevel=info
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/b2b_sales"
      REDIS_URL: "redis://redis:6379/0"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: product-images
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
      - postgres
      - minio
    # volumes:
    #   - ./backend:/app  # Commented out to use built image
    networks:
      - b2b_network
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b_celery_beat
    command: celery -A app.celery beat --loglevel=info
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/b2b_sales"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
      - postgres
    # volumes:
    #   - ./backend:/app  # Commented out to use built image
    networks:
      - b2b_network
    restart: unless-stopped

  # nginx service removed - backend exposed directly on port 9105
  # For production with domain, use external reverse proxy (e.g., Caddy/Traefik) or configure DNS to point to port 9105

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  b2b_network:
    driver: bridge
