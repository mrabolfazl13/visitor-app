name: Build & Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Independent jobs: a failure on one platform never hides the diagnostics of another.
# NOTE: no `continue-on-error` and no `|| true` anywhere — the pipeline must fail honestly.
jobs:
  # ---------------------------------------------------------------------------
  # Frontend (Vite + React + TypeScript) production build — fast validation gate
  # ---------------------------------------------------------------------------
  frontend-web:
    name: Frontend (Vite) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + production build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          ls -la dist
          ls -la dist/assets

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-frontend-dist
          path: desktop/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android (Flutter) — release APK + AAB
  # ---------------------------------------------------------------------------
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors and warnings fatal, infos allowed)
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Verify artifacts
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "APK missing: $APK"; exit 1; }
          test -f "$AAB" || { echo "AAB missing: $AAB"; exit 1; }
          echo "== APK =="; ls -la "$APK"; du -h "$APK"
          echo "== AAB =="; ls -la "$AAB"; du -h "$AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS (Flutter) — release build, unsigned (no signing secrets configured)
  # ---------------------------------------------------------------------------
  ios:
    name: iOS (unsigned release)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Verify artifact
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "Runner.app missing: $APP"; exit 1; }
          ls -la "$APP"

      - name: Package Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r -q Runner.app.zip Runner.app
          ls -la Runner.app.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-app
          path: mobile/build/ios/iphoneos/Runner.app.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Tauri Windows — MSI + NSIS
  # ---------------------------------------------------------------------------
  tauri-windows:
    name: Tauri Windows (MSI + NSIS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Verify artifacts
        shell: bash
        run: |
          set -e
          echo "== bundle dir =="
          find src-tauri/target/release/bundle -maxdepth 2 -type f | sort
          MSI=$(find src-tauri/target/release/bundle/msi -name '*.msi' | head -1)
          EXE=$(find src-tauri/target/release/bundle/nsis -name '*.exe' | head -1)
          test -n "$MSI" || { echo "MSI missing"; exit 1; }
          test -n "$EXE" || { echo "NSIS EXE missing"; exit 1; }
          ls -la "$MSI" "$EXE"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-release
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Tauri Linux — AppImage + deb
  # ---------------------------------------------------------------------------
  tauri-linux:
    name: Tauri Linux (AppImage + deb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Verify artifacts
        run: |
          set -e
          find src-tauri/target/release/bundle -maxdepth 2 -type f | sort
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          test -n "$APPIMAGE" || { echo "AppImage missing"; exit 1; }
          test -n "$DEB" || { echo "deb missing"; exit 1; }
          ls -la "$APPIMAGE" "$DEB"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-release
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
